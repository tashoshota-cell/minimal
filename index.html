<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#111111" />
  <title>Minimal</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">MINIMAL</p>
        <h1>今日、ひとつ手放す。</h1>
      </div>
      <button id="installBtn" class="ghost" hidden>ホーム画面に追加</button>
    </header>

    <section class="stats">
      <div><strong id="totalCount">0</strong><span>累計</span></div>
      <div><strong id="monthCount">0</strong><span>今月</span></div>
      <div><strong id="streakCount">0</strong><span>連続日数</span></div>
      <div><strong id="salesTotal">¥0</strong><span>売却額</span></div>
    </section>

    <section class="card">
      <h2>手放したものを記録</h2>
      <form id="recordForm">
        <label>アイテム名
          <input id="itemName" required placeholder="例：着なくなったTシャツ" />
        </label>
        <div class="two">
          <label>カテゴリ
            <select id="category">
              <option>服</option>
              <option>本</option>
              <option>家電</option>
              <option>書類</option>
              <option>子ども用品</option>
              <option>趣味</option>
              <option>その他</option>
            </select>
          </label>
          <label>手放し方
            <select id="method">
              <option>捨てた</option>
              <option>売った</option>
              <option>譲った</option>
              <option>寄付した</option>
            </select>
          </label>
        </div>
        <div class="two">
          <label>日付
            <input id="date" type="date" required />
          </label>
          <label>売却額（任意）
            <input id="price" type="number" min="0" inputmode="numeric" placeholder="0" />
          </label>
        </div>
        <label>メモ（任意）
          <textarea id="memo" rows="2" placeholder="手放した理由など"></textarea>
        </label>
        <button class="primary" type="submit">記録する</button>
      </form>
    </section>

    <section class="card">
      <div class="sectionHead">
        <h2>月別グラフ</h2>
      </div>
      <div class="chartWrap">
        <canvas id="monthlyChart" aria-label="月別に手放した数"></canvas>
      </div>
    </section>

    <section class="card">
      <div class="sectionHead">
        <h2>履歴</h2>
        <input id="search" class="search" placeholder="検索" />
      </div>
      <div id="history" class="history"></div>
      <button id="exportBtn" class="ghost wide">データを書き出す</button>
    </section>
  </main>

  <template id="rowTemplate">
    <article class="row">
      <div>
        <p class="rowTitle"></p>
        <p class="rowMeta"></p>
        <p class="rowMemo"></p>
      </div>
      <div class="rowRight">
        <strong class="rowPrice"></strong>
        <button class="deleteBtn">削除</button>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
