<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f3f2ef">
  <title>Minimal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg">
  <link rel="stylesheet" href="./style.css?v=3">
</head>
<body>
<main class="wrap">
  <header>
    <div><div class="eyebrow">MINIMAL</div><h1>今日、ひとつ手放す。</h1></div>
    <button id="installBtn" class="ghost" hidden>ホーム画面に追加</button>
  </header>

  <section class="stats">
    <div><b id="total">0</b><span>累計</span></div>
    <div><b id="month">0</b><span>今月</span></div>
    <div><b id="streak">0</b><span>連続日数</span></div>
    <div><b id="sales">¥0</b><span>売却額</span></div>
  </section>

  <section class="card">
    <h2>手放したものを記録</h2>
    <form id="form">
      <label>アイテム名<input id="name" required placeholder="例：着なくなったTシャツ"></label>
      <div class="grid">
        <label>カテゴリ<select id="category"><option>服</option><option>靴</option><option>本</option><option>家電</option><option>家具</option><option>雑貨</option><option>その他</option></select></label>
        <label>手放し方<select id="method"><option>捨てた</option><option>売った</option><option>譲った</option><option>寄付した</option><option>その他</option></select></label>
        <label>日付<input id="date" type="date" required></label>
        <label>売却額（任意）<input id="price" type="number" min="0" inputmode="numeric" value="0"></label>
      </div>
      <label>メモ（任意）<textarea id="memo" placeholder="手放した理由など"></textarea></label>
      <button class="primary" type="submit">記録する</button>
    </form>
  </section>

  <section class="card">
    <h2>月別グラフ</h2>
    <div id="monthlyChart" class="monthlyChart"></div>
  </section>

  <section class="card">
    <div class="sectionHead"><h2>履歴</h2><input id="search" placeholder="検索"></div>
    <div id="history"></div>
    <button id="exportBtn" class="secondary">データを書き出す</button>
  </section>
</main>
<script src="./app.js?v=3"></script>
</body>
</html>
